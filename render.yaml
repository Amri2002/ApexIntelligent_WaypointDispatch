# One-click deploy on Render: New → Blueprint → pick this repo.
databases:
  - name: waypoint-db
    plan: free
    databaseName: waypoint
    user: waypoint
services:
  - type: web
    name: waypoint-dispatch
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: waypoint-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /app/data
