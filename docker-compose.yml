services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://waypoint:waypoint@db:5432/waypoint
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-32-chars-min}
      DATA_DIR: /app/data
      SEED_FORCE: ${SEED_FORCE:-0}
    ports: ["3000:3000"]

volumes:
  pgdata:
